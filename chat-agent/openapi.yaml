openapi: 3.1.0

info:
  title: OpenSuperApp Chat Agent
  description: AI-powered chat agent for OpenSuperApp
  version: 0.1.0

paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}

  /chat:
    post:
      summary: Chat
      description: |
        Process a chat message from the user.

        Both headers are required:
          - x-jwt-assertion: <access_token>
          - x-user-assertion: <access_token> (used for micro-app token exchange)
      operationId: chat_chat_post

      parameters:
        - name: x-jwt-assertion
          in: header
          required: true
          description: User's JWT assertion token
          schema:
            type: string

        - name: x-user-assertion
          in: header
          required: true
          description: User's assertion token (used for micro-app token exchange)
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"

      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

        "401":
          description: Missing required auth headers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

        "500":
          description: Internal agent error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:

    ChatRequest:
      title: ChatRequest
      type: object
      required:
        - message
      properties:
        message:
          type: string
          title: Message
          description: The user's chat message

        history:
          title: History
          description: Prior conversation turns for multi-turn context
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/HistoryMessage"
            - type: "null"

    ChatResponse:
      title: ChatResponse
      type: object
      required:
        - reply
      properties:
        reply:
          type: string
          title: Reply
          description: The agent's response message

    HistoryMessage:
      title: HistoryMessage
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          title: Role
          description: "Message author: 'user' or 'assistant'"
          enum:
            - user
            - assistant
        content:
          type: string
          title: Content
          description: Message text content

    ErrorResponse:
      title: ErrorResponse
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable error description

    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      title: ValidationError
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
          