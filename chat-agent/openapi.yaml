openapi: 3.1.0
info:
  title: OpenSuperApp Chat Agent
  description: AI-powered chat agent for OpenSuperApp
  version: 0.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /

paths:
  /health:
    get:
      summary: Health check
      description: Returns the health status of the chat agent service.
      operationId: health_health_get
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /chat:
    post:
      summary: Send a chat message
      description: |
        Process a chat message from the user. The agent uses LangChain with
        tool-calling to fetch data from micro-app backends (e.g., meals menu,
        leave management) and returns a conversational response.

        The Authorization header must contain the user's access token as
        `Bearer <access_token>`. The token is forwarded to micro-app backends
        via Asgardeo token exchange for authentication.
      operationId: chat_chat_post
      tags:
        - Chat
      parameters:
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
          description: "Bearer <access_token>"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat response from the AI agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "401":
          description: Missing or invalid authorization header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    HistoryMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
          description: The role of the message sender
          example: user
        content:
          type: string
          description: The message content
          example: What's for lunch today?

    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: The user's chat message
          example: What's for lunch today?
        history:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/HistoryMessage"
            - type: "null"
          description: Previous conversation messages for multi-turn context

    ChatResponse:
      type: object
      required:
        - reply
      properties:
        reply:
          type: string
          description: The AI agent's response message
          example: "Today's lunch includes rice, chicken curry, and salad!"

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message
          example: Authorization header must be in format: Bearer <token>

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
