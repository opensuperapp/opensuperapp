[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
markers =
    security: Tests for security guardrails
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests
asyncio_mode = auto
