# Tabs: visit every tab a signed-out user sees, assert something stable on
# each and screenshot it.
appId: ${BUNDLE_IDENTIFIER}
name: smoke-tabs
tags: [smoke]
---
- runFlow: common/launch-signed-out.yml

# Feed: the header title is always there; the News section needs the network,
# so it is waited for but not required.
- tapOn: {id: "newspaper.*"}
- assertVisible: "Feed"
- extendedWaitUntil:
    visible: "News"
    timeout: 20000
    optional: true
- takeScreenshot: tab-feed

# Library: the search bar renders before the list loads.
- tapOn: {id: "books\\.vertical.*"}
- assertVisible: "Search by keywords"
- extendedWaitUntil:
    visible: ".*library_article_0.*"
    timeout: 30000
- takeScreenshot: tab-library

# My Apps: signed out it shows the sign-in prompt instead of the app grid.
- tapOn: {id: "square\\.grid\\.3x3.*"}
- extendedWaitUntil:
    visible: "To view your apps, please sign in"
    timeout: 10000
- assertVisible: "Sign in"
- takeScreenshot: tab-my-apps

# Profile: signed out it shows the sign-in prompt. The version line sits in
# the signed-in foot (beside Sign Out), so it is not checked here.
- tapOn: {id: "person\\.crop\\.circle.*"}
- extendedWaitUntil:
    visible: "Sign in Required"
    timeout: 10000
- assertVisible: "To view your profile, please sign in"
- takeScreenshot: tab-profile
