# Offline: cutting the network shows the offline toast over the tab bar
# (NetInfo), and restoring it clears the toast. Android only: Maestro cannot
# toggle the network on the iOS simulator. The flow restores the network even
# if an assertion fails, through onFlowComplete.
appId: ${BUNDLE_IDENTIFIER}
name: smoke-offline
tags: [smoke]
onFlowComplete:
  - runFlow:
      when:
        platform: Android
      commands:
        - setAirplaneMode: disabled
---
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
      - runFlow: common/launch-signed-out.yml
      - tapOn: "Library"
      - assertNotVisible: "No internet connection"
      - setAirplaneMode: enabled
      - extendedWaitUntil:
          visible: "No internet connection"
          timeout: 20000
      - takeScreenshot: offline-toast
      - setAirplaneMode: disabled
      - extendedWaitUntil:
          notVisible: "No internet connection"
          timeout: 30000
