# Shared subflow: cold-start the app with cleared state (signed out) and wait
# past the Lottie splash until the tab bar is up. Not run on its own: it lives
# in a subfolder so `maestro test .maestro/smoke` does not pick it up.
#
# The retry covers a Maestro iOS race: right after clearState reinstalls the
# app, the driver can ask for the view hierarchy while the app is still in its
# launch animation, get "Application ... is not running", and report a crash.
# A real crash still fails: it would fail every attempt.
#
# Tabs are matched by their SF Symbol icon id (the selected state adds
# ".fill"). NativeTabs exposes no testID, and a text selector here makes
# Maestro 1.41 stall for the whole timeout on the first hierarchy after a
# fresh install (CPU-bound in its text regex filter), so every flow failed.
appId: ${BUNDLE_IDENTIFIER}
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          stopApp: true
      - extendedWaitUntil:
          visible: {id: "books\\.vertical.*"}
          timeout: 45000
