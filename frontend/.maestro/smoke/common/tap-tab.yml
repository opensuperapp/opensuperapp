# Shared subflow: tap a tab. Pass SF (the iOS SF Symbol id regex) and LABEL
# (the tab title). iOS matches the SF Symbol icon id, since a text selector
# stalls Maestro 1.41 there (see launch-signed-out.yml). Android tabs use PNG
# icons and expose no id Maestro reads (NativeTabs' testID becomes a view tag
# there), so Android matches the label, which Material bottom navigation
# renders as text and as the item's content description.
appId: ${BUNDLE_IDENTIFIER}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: {id: "${SF}"}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "${LABEL}"
